name: Build and test

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure CMake
        run: cmake -G Ninja -B build

      - name: Build project with CMake
        run: cmake --build build

      - name: Run test suite
        run: ctest --test-dir build